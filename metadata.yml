Title: Pharmacokinetics Profiler (PhaKinPro)
Description: Profiles a compound across ten pharmacokinetic endpoints covering hepatic
  stability and half-life, renal and microsomal clearance, plasma half-life and protein
  binding, oral bioavailability, Caco-2 permeability, blood-brain barrier penetration
  and central nervous system activity. Several are predicted at more than one cut-off,
  hence eighteen values. PhaKinPro, from Rath and colleagues, was built from over
  10,000 curated molecules spanning twelve endpoints, one binary QSAR classifier each,
  so reliability varies and a full profile should not be read as uniformly dependable.
